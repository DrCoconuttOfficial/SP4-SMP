sleep-percentage: 50

# Percentage of ONLINE players that must cast a "no" vote to cancel the vote.
no-vote-percentage: 50

# How long (in seconds) a sleep vote stays open before it expires.
vote-timeout-seconds: 60

# Whether players can vote against skipping the night with /sleepvote no.
enable-no-voting: true

# Whether to clear storms/thunder when the night is skipped.
clear-weather: true

# ------------------------------------------------------------
#  Messages (color codes with & are supported)
#  Placeholders:
#    %sleeping%   - number of players currently sleeping
#    %needed%     - number needed to skip / to fail
#    %percentage% - the configured sleep percentage
#    %novotes%    - number of no-votes cast
#    %player%     - relevant player name
# ------------------------------------------------------------
messages:
  prefix: '&8[&bSleepVote&8] &r'
  sleep-status: '&e%sleeping%/%needed% &7players are sleeping! Need &e%percentage%%&7 to skip the night.'
  night-skipped: '&aThe players have voted to skip the night!'
  vote-failed: '&cThe vote to skip the night has failed.'
  vote-timeout: '&cThe sleep vote expired before enough players slept.'
  vote-cancelled: '&7Everyone got out of bed - the sleep vote was cancelled.'
  no-vote-cast: '&e%player% &7voted NO. (&c%novotes%/%needed%&7 needed to fail)'
  no-vote-cast-help: ''
  no-voting-disabled: '&cVoting against skipping the night is disabled.'
  no-active-vote: '&cThere is no active sleep vote right now.'
  already-voted-no: '&cYou have already voted no.'
  no-permission: '&cYou do not have permission to do that.'
  config-reloaded: '&aSleepVote config reloaded!'
